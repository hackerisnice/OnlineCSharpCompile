name: Build EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持在 GitHub 网页上手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++1 libc++abi1

      - name: Setup bflat
        run: |
          curl -L https://github.com/bflattened/bflat/releases/download/v8.0.2/bflat-8.0.2-linux-glibc-x64.tar.gz | tar -xz
          chmod +x bflat

      - name: Build Windows Binary
        run: |
          ./bflat build cam.cs -o cam.exe --os windows --arch x64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraCheck
          path: cam.exe
